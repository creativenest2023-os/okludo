<!DOCTYPE html>
<!-- Main Menu Screen Overlay -->
<div id="main-menu" class="menu-overlay">
<div class="menu-card">
<h1 class="game-logo">LUDO CLASSIC</h1>

<div class="menu-buttons">
<button class="btn btn-primary" onclick="startMode('local_4p')">
<span class="icon">🎮</span> 4-Player Free For All
</button>

<!-- 2v2 Team Mode Button -->
<button class="btn btn-team" onclick="startMode('team_2v2')">
<span class="icon">👥</span> 2v2 Team Mode (Red+Yellow vs Green+Blue)
</button>

<button class="btn btn-success" onclick="startMode('online')">
<span class="icon">🌐</span> Online Multiplayer
</button>

<button class="btn btn-secondary" onclick="toggleSettings()">
<span class="icon">⚙️</span> Settings
</button>
</div>
</div>
</div>

<!-- In-Game Exit Button (Top Corner) -->
<button id="exit-btn" class="exit-btn" onclick="exitToMenu()" style="display: none;">
🚪 Exit Game
</button>


<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classic Ludo Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-shell">

        <!-- HEADER -->
        <header class="game-header">

            <div class="brand">
                <span class="brand-icon">🎲</span>
                <div>
                    <h1>CLASSIC LUDO</h1>
                    <p>Roll • Move • Capture • Win</p>
                </div>
            </div>

            <button
                id="newGameBtn"
                class="new-game-btn"
                type="button"
            >
                New Game
            </button>

        </header>


        <!-- TURN STATUS -->
        <section class="status-panel">

            <div class="turn-indicator">
                <span id="turnColorDot"></span>

                <strong id="turnText">
                    RED'S TURN
                </strong>
            </div>

            <div
                id="gameMessage"
                class="game-message"
            >
                Roll the dice to begin.
            </div>

        </section>


        <!-- BOARD WRAPPER -->
        <section class="board-wrapper">

            <div
                id="ludoBoard"
                class="ludo-board"
                aria-label="Classic Ludo Board"
            >

                <!-- 225 CELLS ARE GENERATED BY JAVASCRIPT -->

                <!-- HOME BASES -->

                <div class="home-base home-red">

                    <div class="home-inner">

                        <div class="home-pawn-slot" id="red-base-0"></div>
                        <div class="home-pawn-slot" id="red-base-1"></div>
                        <div class="home-pawn-slot" id="red-base-2"></div>
                        <div class="home-pawn-slot" id="red-base-3"></div>

                    </div>

                </div>


                <div class="home-base home-green">

                    <div class="home-inner">

                        <div class="home-pawn-slot" id="green-base-0"></div>
                        <div class="home-pawn-slot" id="green-base-1"></div>
                        <div class="home-pawn-slot" id="green-base-2"></div>
                        <div class="home-pawn-slot" id="green-base-3"></div>

                    </div>

                </div>


                <div class="home-base home-blue">

                    <div class="home-inner">

                        <div class="home-pawn-slot" id="blue-base-0"></div>
                        <div class="home-pawn-slot" id="blue-base-1"></div>
                        <div class="home-pawn-slot" id="blue-base-2"></div>
                        <div class="home-pawn-slot" id="blue-base-3"></div>

                    </div>

                </div>


                <div class="home-base home-yellow">

                    <div class="home-inner">

                        <div class="home-pawn-slot" id="yellow-base-0"></div>
                        <div class="home-pawn-slot" id="yellow-base-1"></div>
                        <div class="home-pawn-slot" id="yellow-base-2"></div>
                        <div class="home-pawn-slot" id="yellow-base-3"></div>

                    </div>

                </div>


                <!-- CENTER FINISH -->
                <div class="finish-zone">

                    <div class="finish-red"></div>
                    <div class="finish-green"></div>
                    <div class="finish-yellow"></div>
                    <div class="finish-blue"></div>

                    <div
                        id="finishTokens"
                        class="finish-tokens"
                    ></div>

                </div>


                <!-- 3D DICE -->
                <div class="dice-control">

                    <div
                        id="diceScene"
                        class="dice-scene"
                        role="button"
                        tabindex="0"
                        aria-label="Roll Dice"
                    >

                        <div
                            id="dice"
                            class="dice"
                        >

                            <!-- FACE 1 -->
                            <div class="dice-face face-one">
                                <span class="pip center-pip"></span>
                            </div>

                            <!-- FACE 2 -->
                            <div class="dice-face face-two">
                                <span class="pip top-left"></span>
                                <span class="pip bottom-right"></span>
                            </div>

                            <!-- FACE 3 -->
                            <div class="dice-face face-three">
                                <span class="pip top-left"></span>
                                <span class="pip center-pip"></span>
                                <span class="pip bottom-right"></span>
                            </div>

                            <!-- FACE 4 -->
                            <div class="dice-face face-four">
                                <span class="pip top-left"></span>
                                <span class="pip top-right"></span>
                                <span class="pip bottom-left"></span>
                                <span class="pip bottom-right"></span>
                            </div>

                            <!-- FACE 5 -->
                            <div class="dice-face face-five">
                                <span class="pip top-left"></span>
                                <span class="pip top-right"></span>
                                <span class="pip center-pip"></span>
                                <span class="pip bottom-left"></span>
                                <span class="pip bottom-right"></span>
                            </div>

                            <!-- FACE 6 -->
                            <div class="dice-face face-six">
                                <span class="pip top-left"></span>
                                <span class="pip middle-left"></span>
                                <span class="pip bottom-left"></span>
                                <span class="pip top-right"></span>
                                <span class="pip middle-right"></span>
                                <span class="pip bottom-right"></span>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- CONTROLS -->
        <section class="bottom-controls">

            <button
                id="rollButton"
                class="roll-button"
                type="button"
            >
                <span>🎲</span>
                ROLL DICE
            </button>

            <div class="dice-result">
                Dice:
                <strong id="diceResult">-</strong>
            </div>

        </section>


        <!-- PLAYER ORDER -->
        <section class="players-bar">

            <div class="player-card red-card active-player" id="player-red">
                <span class="player-dot"></span>
                RED
            </div>

            <div class="player-card green-card" id="player-green">
                <span class="player-dot"></span>
                GREEN
            </div>

            <div class="player-card yellow-card" id="player-yellow">
                <span class="player-dot"></span>
                YELLOW
            </div>

            <div class="player-card blue-card" id="player-blue">
                <span class="player-dot"></span>
                BLUE
            </div>

        </section>

    </main>


    <!-- VICTORY POPUP -->
    <div
        id="victoryPopup"
        class="victory-popup hidden"
    >

        <div class="victory-box">

            <div class="victory-trophy">
                🏆
            </div>

            <h2 id="victoryTitle">
                RED WINS!
            </h2>

            <p id="victoryText">
                All four pawns reached the finish.
            </p>

            <button
                id="playAgainBtn"
                type="button"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
