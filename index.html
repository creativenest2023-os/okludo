<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Classic</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<!-- Main Menu Screen Overlay -->
<div id="main-menu" class="menu-overlay">
<div class="menu-card">
<h1 class="game-logo">LUDO CLASSIC</h1>

<div class="menu-buttons">
<!-- Play vs Computer Button -->
<button class="btn btn-warning" onclick="startMode('vs_computer')">
<span class="icon">💻</span> Play vs Computer
</button>

<!-- 2-Player Local Button -->
<button class="btn btn-info" onclick="startMode('local_2p')">
<span class="icon">👥</span> 2-Player Local
</button>

<!-- 4-Player Local Button -->
<button class="btn btn-primary" onclick="startMode('local_4p')">
<span class="icon">🎮</span> 4-Player Free For All
</button>

<!-- Online Multiplayer Button -->
<button class="btn btn-success" onclick="startMode('online')">
<span class="icon">🌐</span> Online Multiplayer
</button>
</div>
</div>
</div>

<!-- Game Container -->
<div id="game-container" style="display: none;">
<div id="ludo-board"></div>
</div>

<script src="script.js"></script>
</body>
</html>
